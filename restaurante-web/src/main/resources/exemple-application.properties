# Renomeie esse arquivo para application.properties

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/nome_db
spring.datasource.username=seu_usuario
spring.datasource.password=sua_senha
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Google Cloud Storage
# Aponte para o arquivo JSON da chave de serviço que você já possui
google.cloud.credentials.path=/caminho/para/sua-chave.json
google.cloud.bucket.name=nome-do-seu-bucket

# Porta (opcional)
server.port=8080